<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>1イニング対決</title>
<link rel="stylesheet" href="css/style.css?v=13">
</head>
<body>
<div id="wrap">
  <canvas id="c3"></canvas>
  <canvas id="c" width="420" height="640"></canvas>
  <div id="controls">
    <div id="hint"></div>
    <div id="panel" class="hidden">
      <div class="label">① 球種をえらぶ → ② コースを指でなぞって、離すと投球</div>
      <div class="row" id="pitchButtons"></div>
    </div>

    <div id="guessPanel" class="hidden panel2">
      <div class="label"><span id="guessLabel"></span> <button id="handBtn" class="handBtn"></button></div>
      <div class="row" id="guessButtons"></div>
    </div>
  </div>


  <div id="menu" class="overlay">
    <h1>⚾ 1イニング対決</h1>
    <p><b>1アウト 1塁・2塁</b> から攻撃スタート！</p>
    <p>3アウトになるまで攻撃して、<br>相手より多く点を取ったら勝ち。</p>
    <p class="small">裏の攻撃で逆転したらサヨナラ。<br>同点なら延長（また1アウト1・2塁から）。</p>
    <div class="hands">
      <div class="handRow"><span class="team red">赤（あなた／P1）の投手</span><button data-team="0" data-hand="R" class="sel">右投げ</button><button data-team="0" data-hand="L">左投げ</button></div>
      <div class="handRow"><span class="team blue">青（CPU／P2）の投手</span><button data-team="1" data-hand="R" class="sel">右投げ</button><button data-team="1" data-hand="L">左投げ</button></div>
    </div>
    <button id="btn1p">1人で（vs CPU）</button>
    <button id="btn2p" class="sub">2人で（交代で操作）</button>
  </div>

  <div id="intro" class="overlay hidden">
    <h1 id="introTitle"></h1>
    <p class="big" id="introTeam"></p>
    <p>1アウト 1塁・2塁から</p>
    <p id="introRole"></p>
    <p class="small" id="introScore"></p>
    <button id="introBtn">プレイボール</button>
  </div>

  <div id="handoff" class="overlay hidden">
    <h1 id="handoffTitle"></h1>
    <p>ピッチャーは投げる球を決めました。</p>
    <p>準備ができたらタップ！</p>
    <button id="handoffBtn">投球開始</button>
  </div>

  <div id="end" class="overlay hidden">
    <h1 id="endTitle"></h1>
    <p class="big" id="endScore"></p>
    <p id="endSub"></p>
    <button id="retryBtn">もう一回</button>
    <button id="menuBtn" class="sub">メニューへ</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/config.js?v=13"></script>
<script src="js/state.js?v=13"></script>
<script src="js/game.js?v=13"></script>
<script src="js/ball.js?v=13"></script>
<script src="js/poses.js?v=13"></script>
<script src="js/overlay.js?v=13"></script>
<script src="js/world3d.js?v=13"></script>
<script src="js/hud.js?v=13"></script>
<script src="js/main.js?v=13"></script>
</body>
</html>
