<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>画面のテスト</title>
<style>
  body { font-family: system-ui, "Hiragino Sans", "Yu Gothic UI", sans-serif; margin: 16px; background: #f6f7fb; color: #1a1c2e; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  #summary { font-size: 18px; font-weight: bold; margin: 8px 0 14px; }
  .ok { color: #11883a; } .ng { color: #c62828; }
  .wrap { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  table { border-collapse: collapse; background: #fff; max-width: 560px; }
  td { border-bottom: 1px solid #e3e5ef; padding: 6px 10px; font-size: 14px; vertical-align: top; }
  td.mark { width: 32px; text-align: center; }
  .detail { color: #c62828; font-size: 12px; }
  iframe { width: 375px; height: 760px; border: 1px solid #ccd; background: #000; }
</style>
</head>
<body>
<h1>⚾ 1イニング対決：画面のテスト</h1>
<p>本物のゲーム（右）をスマホの大きさで開いて、<b>見えているボタンの上に何もかぶさっていないか</b>（指で押したらちゃんとボタンに届くか）を、<br>
メニュー → 試合開始 → 打者 → 投手 の順にたしかめます。終わるまで10秒ほどかかります。</p>
<div id="summary">テスト中…</div>
<div class="wrap">
  <table id="results"></table>
  <iframe id="game" src="../index.html"></iframe>
</div>

<script>
const results = [];
const frame = document.getElementById('game');
const wait = ms => new Promise(r => setTimeout(r, ms));

// 見えているボタン全部について、ボタンの真ん中に「指を置いたら何に当たるか」を調べる
function checkButtons(stepName) {
  const doc = frame.contentDocument;
  const buttons = [...doc.querySelectorAll('button')].filter(b => b.offsetParent !== null && b.getBoundingClientRect().width > 0);
  const blocked = [];
  for (const b of buttons) {
    const r = b.getBoundingClientRect();
    const hit = doc.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
    if (!hit || !(hit === b || b.contains(hit))) blocked.push(`「${b.textContent.trim()}」の上に ${hit ? (hit.id ? '#' + hit.id : hit.tagName) : '何もない'}`);
  }
  results.push({ name: `${stepName}：見えているボタン ${buttons.length} 個が全部押せる`, ok: buttons.length > 0 && blocked.length === 0, detail: buttons.length ? blocked.join(' / ') : 'ボタンが見つからない' });
}
// ボタンを「指で押す」：本物と同じように、その場所の一番上にあるものを押す
function tapButton(id) {
  const doc = frame.contentDocument;
  const visible = x => x.offsetParent !== null && x.getBoundingClientRect().width > 0;   // 隠れているボタンは選ばない
  const b = doc.getElementById(id) || [...doc.querySelectorAll('button')].find(x => x.textContent.trim() === id && visible(x));
  const r = b.getBoundingClientRect();
  const hit = doc.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
  if (hit) hit.click();
  return hit === b || (hit && b.contains(hit));
}
function check(name, ok, detail = '') { results.push({ name, ok, detail }); }

(async () => {
  await new Promise(r => frame.addEventListener('load', r, { once: true }));
  await wait(1500);
  const g = frame.contentWindow;
  const err = [];
  g.addEventListener('error', e => err.push(e.message));

  checkButtons('メニュー');
  check('メニューの「1人で」を指で押せる', tapButton('btn1p'));
  await wait(300);
  check('押したらイニングの始まりの画面になる', g.eval('state') === 'intro');
  checkButtons('イニングの始まり');
  check('「プレイボール」を指で押せる', tapButton('introBtn'));
  await wait(400);
  check('押したら打者の番（狙い球を選ぶ）になる', g.eval('state') === 'guess');
  checkButtons('打者の番');
  check('狙い球「ストレート」を指で押せる', tapButton('ストレート'));
  check('「右打ち⇄」を指で押せる', tapButton('handBtn'));
  await wait(200);
  check('ゲーム画面（タップでスイングする所）が一番上にある', (() => {
    const doc = frame.contentDocument, c = doc.getElementById('c').getBoundingClientRect();
    const hit = doc.elementFromPoint(c.left + c.width / 2, c.top + c.height / 2);
    return hit && hit.id === 'c';
  })());
  // 投手の番まで進める（裏にする）
  g.eval("startHalf(1)");
  await wait(200);
  checkButtons('裏の始まり');
  tapButton('introBtn');
  await wait(400);
  check('投手の番（球種を選ぶ）になる', g.eval('state') === 'aim');
  checkButtons('投手の番');
  check('球種「フォーク」を指で押せる', tapButton('フォーク'));
  check('ゲームの中でエラーが出ていない', err.length === 0, err.join(' / '));

  const table = document.getElementById('results');
  for (const r of results) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td class="mark">${r.ok ? '✅' : '❌'}</td><td>${r.name}${r.ok || !r.detail ? '' : `<div class="detail">${r.detail}</div>`}</td>`;
    table.appendChild(tr);
  }
  const fail = results.filter(r => !r.ok).length;
  const sum = document.getElementById('summary');
  sum.textContent = fail === 0 ? `全部 OK（${results.length}件）` : `${fail}件 失敗 ／ ${results.length}件`;
  sum.className = fail === 0 ? 'ok' : 'ng';
  window.TEST_RESULT = { total: results.length, fail, failures: results.filter(r => !r.ok) };
})();
</script>
</body>
</html>
